<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">ManyMesh mean PSNR delta against matched-face controls</title>
<desc id="desc">All four mean paired PSNR deltas are negative and their 95 percent group-bootstrap intervals exclude zero, favoring the QEM or meshoptimizer control over ManyMesh.</desc>
<rect width="100%" height="100%" fill="#f7f8fa"/>
<text x="48" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#182230">Matched-face PSNR favors deterministic controls</text>
<text x="48" y="75" font-family="Arial,sans-serif" font-size="14" fill="#526071">ManyMesh minus control (dB); negative values favor the control</text>

<line x1="383.6" y1="105" x2="383.6" y2="365" stroke="#d9dee6" stroke-width="1"/>
<text x="383.6" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526071">-6</text>
<line x1="517.9" y1="105" x2="517.9" y2="365" stroke="#d9dee6" stroke-width="1"/>
<text x="517.9" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526071">-4</text>
<line x1="652.1" y1="105" x2="652.1" y2="365" stroke="#d9dee6" stroke-width="1"/>
<text x="652.1" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526071">-2</text>
<line x1="786.4" y1="105" x2="786.4" y2="365" stroke="#263445" stroke-width="2"/>
<text x="786.4" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526071">0</text>
<text x="48" y="160" font-family="Arial,sans-serif" font-size="14" fill="#263445">Native: Border-preserving QEM</text>
<line x1="613.0" y1="155" x2="677.9" y2="155" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
<line x1="613.0" y1="148" x2="613.0" y2="162" stroke="#b45309" stroke-width="2"/>
<line x1="677.9" y1="148" x2="677.9" y2="162" stroke="#b45309" stroke-width="2"/>
<circle cx="645.6" cy="155" r="7" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
<text x="850" y="160" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">-2.10 dB</text>
<text x="48" y="215" font-family="Arial,sans-serif" font-size="14" fill="#263445">Native: meshoptimizer LockBorder</text>
<line x1="605.7" y1="210" x2="663.5" y2="210" stroke="#176b87" stroke-width="4" stroke-linecap="round"/>
<line x1="605.7" y1="203" x2="605.7" y2="217" stroke="#176b87" stroke-width="2"/>
<line x1="663.5" y1="203" x2="663.5" y2="217" stroke="#176b87" stroke-width="2"/>
<circle cx="634.0" cy="210" r="7" fill="#176b87" stroke="#ffffff" stroke-width="2"/>
<text x="850" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#176b87">-2.27 dB</text>
<text x="48" y="290" font-family="Arial,sans-serif" font-size="14" fill="#263445">4x MSAA: Border-preserving QEM</text>
<line x1="425.9" y1="285" x2="554.4" y2="285" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
<line x1="425.9" y1="278" x2="425.9" y2="292" stroke="#b45309" stroke-width="2"/>
<line x1="554.4" y1="278" x2="554.4" y2="292" stroke="#b45309" stroke-width="2"/>
<circle cx="487.3" cy="285" r="7" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
<text x="850" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309">-4.45 dB</text>
<text x="48" y="345" font-family="Arial,sans-serif" font-size="14" fill="#263445">4x MSAA: meshoptimizer LockBorder</text>
<line x1="367.4" y1="340" x2="486.8" y2="340" stroke="#176b87" stroke-width="4" stroke-linecap="round"/>
<line x1="367.4" y1="333" x2="367.4" y2="347" stroke="#176b87" stroke-width="2"/>
<line x1="486.8" y1="333" x2="486.8" y2="347" stroke="#176b87" stroke-width="2"/>
<circle cx="424.1" cy="340" r="7" fill="#176b87" stroke="#ffffff" stroke-width="2"/>
<text x="850" y="345" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#176b87">-5.40 dB</text>
